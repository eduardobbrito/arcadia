<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcadia</title>
<link rel="stylesheet" href="../lib/theme.css">
<link rel="stylesheet" href="../lib/space-form.css">
<link rel="stylesheet" href="../bar/bar.css">
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<div id="app">
  <header class="top" id="top">
    <button class="icon" id="back" title="Back" aria-label="Back"></button>
    <button class="icon" id="forward" title="Forward" aria-label="Forward"></button>
    <button class="icon" id="reload" title="Reload" aria-label="Reload"></button>
    <button class="addr" id="addr" title="Search or enter address"><span id="host"></span></button>
    <button class="icon" id="copy" title="Copy link" aria-label="Copy link"></button>
  </header>

  <ul class="favs" id="favs" aria-label="Pinned in every space"></ul>

  <button class="space" id="space" title="Edit this space">
    <span id="space-emoji"></span><span id="space-name"></span>
  </button>

  <div class="scroll" id="scroll">
    <ul class="rows" id="pinned" aria-label="Pinned tabs"></ul>
    <div class="rule" id="rule">
      <button class="newtab" id="newtab"><span class="plus"></span><span>New tab</span><kbd id="newtab-key"></kbd></button>
      <button class="clear" id="clear" title="Close tabs you are not using. The current tab and tabs playing sound stay open.">Clear</button>
    </div>
    <ul class="rows" id="today" aria-label="Tabs"></ul>
    <p class="empty" id="empty" hidden></p>
  </div>

  <footer class="foot">
    <button class="icon" id="archive" title="Recently closed tabs" aria-label="Recently closed tabs"></button>
    <div class="dots" id="dots" role="tablist" aria-label="Spaces"></div>
    <button class="icon" id="add-space" title="New space" aria-label="New space"></button>
    <button class="icon" id="settings" title="Settings" aria-label="Settings"></button>
  </footer>
</div>

<div class="drop-line" id="drop-line" hidden></div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="barwrap" id="barwrap" hidden><div id="barhost"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
